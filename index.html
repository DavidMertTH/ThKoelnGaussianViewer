<!doctype html>
<html lang="en">
  <head>

    <title>Gaussian Viewer</title>
    <link rel="stylesheet" href="/src/pages.css" />

    <main class="landing">

      <p class="landing-lead">Explore Gaussian splat scenes on the screen or in VR.</p>
      <a class="vr-start-button" href="/viewer.html?vr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7h13A2.5 2.5 0 0 1 21 9.5v5a2.5 2.5 0 0 1-2.5 2.5h-3.3l-1.7-2.4a1.8 1.8 0 0 0-3 0L8.8 17H5.5A2.5 2.5 0 0 1 3 14.5v-5A2.5 2.5 0 0 1 5.5 7z" /><circle cx="8" cy="12" r="1.6" /><circle cx="16" cy="12" r="1.6" /></svg>

      <nav class="landing-actions" aria-label="Start">
        <a class="big-button" href="/scenes.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" /></svg>
          <span>Browse scenes</span>
        </a>
        <a class="big-button" href="/viewer.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8z" /><path d="m3 8 9 5 9-5M12 13v8" /></svg>
          <span>Open viewer</span>
